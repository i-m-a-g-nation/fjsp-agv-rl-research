name: tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests with coverage
        run: python -m pytest --cov=fjsp_lab --cov-report=term-missing --cov-fail-under=80

      - name: Phase 1 and Phase 2A experiments
        run: |
          python experiments/p1_static_fjsp.py --time-limit 2 --output-dir experiments/runs/ci-p1
          python experiments/p2_dynamic_protocol.py --output-dir experiments/runs/ci-p2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-runs
          path: experiments/runs/ci-*
