[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fjsp-lab"
version = "0.2.0"
description = "Scheduling research platform: static/dynamic FJSP and parallel machines with maintenance"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib>=3.8.4,<3.10",
    "ortools",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# The attention policy needs PyTorch; install it in a separate environment
# (see START_HERE.md) rather than in the project environment.
torch = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:.*deprecated - use:DeprecationWarning"]

[tool.coverage.run]
source = ["src/fjsp_lab"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
