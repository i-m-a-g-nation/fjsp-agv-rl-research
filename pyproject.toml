[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fjsp-agv-rl"
version = "0.1.0"
description = "FJSP + AGV + RL Research Platform"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib>=3.8.4,<3.10",
    "pillow>=10.4,<12",
    "pydantic",
    "networkx",
    "scipy",
    "ortools",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "coverage>=7.10,<8",
]
research = [
    "langgraph>=1.2.17,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "faiss-cpu>=1.15.1,<2",
    "pypdf>=6.21.2,<7",
    "requests>=2.34.2,<3",
    "langchain-openai>=1.7.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
